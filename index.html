<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>एम. एस. प्रेम सागर खाद्यान्न उद्योग | M. S. Prem Sagar Khadyan Udyog</title>
  
  <!-- Google Fonts: Noto Sans Devanagari & Poppins -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    :root {
      --primary-green: #064e3b;
      --medium-green: #047857;
      --light-green: #ecfdf5;
      --gold-accent: #d97706;
      --gold-bright: #f59e0b;
      --bg-color: #faf8f5;
      --text-dark: #1e293b;
      --text-muted: #475569;
      --card-shadow: 0 12px 32px -4px rgba(6, 78, 59, 0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-dark);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    /* Hero Header Section */
    .hero {
      background: radial-gradient(circle at top right, #059669 0%, #064e3b 65%, #022c22 100%);
      color: #ffffff;
      text-align: center;
      padding: 55px 20px 80px;
      border-bottom-left-radius: 38px;
      border-bottom-right-radius: 38px;
      box-shadow: 0 15px 35px rgba(6, 78, 59, 0.25);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(251, 191, 36, 0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 6px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 16px;
      border: 1px solid rgba(253, 230, 138, 0.45);
      color: #fef3c7;
    }

    .hero h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .hero h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: #fcd34d;
      margin-bottom: 14px;
      letter-spacing: 0.4px;
    }

    .hero p {
      font-size: 0.98rem;
      opacity: 0.92;
      max-width: 460px;
      margin: 0 auto 28px;
    }

    .hero-btns {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .btn-gold {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: #ffffff;
      padding: 12px 26px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(217, 119, 6, 0.4);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(217, 119, 6, 0.55);
    }

    .btn-outline {
      border: 1.5px solid rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.08);
      color: #ffffff;
      padding: 11px 26px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .btn-outline:hover {
      background: #ffffff;
      color: var(--primary-green);
      transform: translateY(-2px);
    }

    /* Main Content Container */
    .container {
      max-width: 600px;
      margin: -42px auto 40px;
      padding: 0 16px;
      position: relative;
      z-index: 10;
    }

    .card {
      background: #ffffff;
      border-radius: 26px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: var(--card-shadow);
      border: 1px solid rgba(226, 232, 240, 0.9);
    }

    .section-title {
      color: var(--primary-green);
      font-size: 1.35rem;
      font-weight: 800;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-title::before {
      content: '';
      width: 6px;
      height: 26px;
      background: linear-gradient(to bottom, #f59e0b, #d97706);
      border-radius: 6px;
    }

    /* Trust Badges Grid */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 22px;
      text-align: center;
    }

    .feature-item {
      background: linear-gradient(180deg, #f0fdf4 0%, #dcfce7 100%);
      padding: 16px 8px;
      border-radius: 18px;
      border: 1px solid #bbf7d0;
    }

    .feature-item i {
      color: var(--medium-green);
      font-size: 1.55rem;
      margin-bottom: 8px;
      display: block;
    }

    .feature-item span {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary-green);
    }

    /* Product Cards */
    .product-card {
      display: flex;
      align-items: center;
      gap: 18px;
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(217, 119, 6, 0.12);
      border-color: #fde68a;
    }

    .product-img-box {
      width: 125px;
      height: 125px;
      border-radius: 16px;
      border: 1px solid #fef3c7;
      background: radial-gradient(circle, #fffbeb 0%, #fef3c7 100%);
      padding: 8px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-info {
      flex: 1;
    }

    .product-title {
      color: #991b1b;
      font-size: 1.2rem;
      font-weight: 800;
      margin-bottom: 2px;
    }

    .product-sub {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--gold-accent);
      margin-bottom: 6px;
    }

    .product-desc {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.45;
      margin-bottom: 12px;
    }

    .wa-order-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: #ffffff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(37, 211, 102, 0.28);
      transition: transform 0.2s ease;
    }

    .wa-order-btn:hover {
      transform: scale(1.03);
    }

    /* Director Contact Card */
    .director-card {
      padding: 0;
      overflow: hidden;
      text-align: center;
    }

    .director-header {
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);
      height: 112px;
      position: relative;
      border-bottom: 3px solid #f59e0b;
    }

    .director-img {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      object-fit: cover;
      border: 5px solid #ffffff;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.16);
      margin-top: -64px;
      background: #f1f5f9;
      position: relative;
      z-index: 2;
    }

    .director-body {
      padding: 16px 24px 28px;
    }

    .director-badge {
      display: inline-block;
      background: var(--light-green);
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--medium-green);
      margin-bottom: 8px;
    }

    .director-name {
      font-size: 1.42rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 2px;
    }

    .director-role {
      color: var(--gold-accent);
      font-weight: 700;
      font-size: 0.94rem;
      margin-bottom: 6px;
    }

    .director-address {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 22px;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 18px;
    }

    .contact-tile {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 16px 10px;
      text-decoration: none;
      color: var(--text-dark);
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.25s ease;
    }

    .contact-tile:hover {
      background: #ffffff;
      border-color: var(--gold-accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.05);
    }

    .contact-tile i {
      font-size: 1.55rem;
      margin-bottom: 8px;
    }

    .icon-call { color: var(--primary-green); }
    .icon-wa { color: #25D366; }
    .icon-mail { color: #2563eb; }
    .icon-map { color: #dc2626; }

    .tile-label {
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .tile-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      word-break: break-all;
    }

      width: 100%;
      background: linear-gradient(135deg, #064e3b 0%, #047857 100%);

<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>एम एस प्रेम सागर खाद्यान्न उद्योग | M S Prem Sagar Khadyan Udyog</title>
  
  <!-- Google Fonts: Noto Sans Devanagari & Poppins -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cloudflare.com">

  <style>
    :root {
      --bg-obsidian: #0d100f;
      --card-surface: #151918;
      --box-surface: #1c2220;
      --gold-light: #f3d778;
      --gold-mid: #d4af37;
      --gold-dark: #997415;
      --gold-border: rgba(212, 175, 55, 0.45);
      --text-white: #ffffff;
      --text-muted: #cbd5e1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Noto Sans Devanagari', 'Poppins', sans-serif;
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-white);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    .main-wrapper {
      max-width: 560px;
      margin: 0 auto;
      padding: 16px 14px 40px;
    }

    /* माथिल्लो शाही हेडर (Royal Header) */
    .hero {
      background: radial-gradient(circle at top center, #1e2623 0%, #111514 75%, #0a0d0c 100%);
      border: 1.5px solid var(--gold-border);
      border-radius: 26px;
      padding: 22px 18px 28px;
      text-align: center;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.65);
      margin-bottom: 20px;
      position: relative;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .brand-monogram {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1.5px solid var(--gold-mid);
      background: radial-gradient(circle, #242b28 0%, #121615 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--gold-light);
      box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: linear-gradient(135deg, #d4af37 0%, #aa8018 100%);
      color: #0d100f;
      padding: 5px 16px;
      border-radius: 50px;
      font-size: 0.82rem;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .hero h1 {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(to right, #fff8dc, #f3d778, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
      letter-spacing: -0.3px;
    }

    .hero h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .hero p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    /* सुनौलो र म्याट बटनहरू */
    .hero-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #e5c158 0%, #b5891d 100%);
      color: #0d100f;
      padding: 12px 10px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 800;
      font-size: 0.88rem;
      border: 1px solid #fff0b3;
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.05);
      color: var(--gold-light);
      padding: 12px 10px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.88rem;
      border: 1.5px solid var(--gold-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.2s ease;
    }

    .btn-gold:hover, .btn-outline:hover {
      transform: translateY(-2px);
    }

    /* प्रिमियम सेक्सन कार्ड */
    .card {
      background: var(--card-surface);
      border: 1.5px solid var(--gold-border);
      border-radius: 24px;
      padding: 22px 18px;
      margin-bottom: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .section-title {
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 14px;
      letter-spacing: 0.3px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section-title::before, .section-title::after {
      content: "";
      height: 1.5px;
      width: 28px;
      background: linear-gradient(90deg, transparent, var(--gold-mid));
    }

    .section-title::after {
      background: linear-gradient(90deg, var(--gold-mid), transparent);
    }

    .about-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.65;
    }

    .about-desc strong {
      color: var(--gold-light);
    }

    /* ३ वटा अल्ट्रा-प्रिमियम विशेषता बक्सहरू */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .feature-item {
      background: linear-gradient(145deg, #1f2624 0%, #121615 100%);
      border: 1.5px solid var(--gold-mid);
      border-radius: 16px;
      padding: 18px 6px;
      text-align: center;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .feature-item:hover {
      transform: translateY(-3px);
    }

    .feature-icon {
      width: 32px;
      height: 32px;
      margin-bottom: 10px;
      stroke: var(--gold-light);
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .feature-item span {
      font-size: 0.84rem;
      font-weight: 700;
      color: #ffffff;
    }

    /* उत्पादनहरू (3-Column Luxury Showcase Grid) */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .product-card {
      background: linear-gradient(180deg, #1c2220 0%, #121615 100%);
      border: 1.2px solid var(--gold-border);
      border-radius: 16px;
      padding: 10px 8px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      border-color: var(--gold-light);
    }

    .product-img-box {
      width: 100%;
      height: 95px;
      background: #ffffff;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 1px solid var(--gold-mid);
    }

    .product-img-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .product-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--gold-light);
      margin-bottom: 3px;
      line-height: 1.25;
    }

    .product-sub {
      font-size: 0.68rem;
      color: #94a3b8;
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .wa-order-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: linear-gradient(135deg, #d4af37 0%, #997415 100%);
      color: #0d100f;
      text-decoration: none;
      padding: 6px 8px;
      border-radius: 50px;
      font-size: 0.72rem;
      font-weight: 800;
      width: 100%;
    }

    /* सञ्चालक / डाइरेक्टर अल्ट्रा-प्रिमियम कार्ड */
    .director-card {
      background: linear-gradient(160deg, #1b221f 0%, #101413 100%);
      border: 1.5px solid var(--gold-mid);
      border-radius: 26px;
      padding: 24px 18px;
      margin-bottom: 18px;
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.65);
    }

    .director-top {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(212, 175, 55, 0.25);
    }

    .director-img-ring {
      width: 86px;
      height: 86px;
      min-width: 86px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(135deg, #fff0b3, #d4af37, #8a640d);
      box-shadow: 0 6px 18px rgba(212, 175, 55, 0.35);
    }

    .director-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      background: #1c2220;
    }

    .director-info {
      text-align: left;
    }

    .director-badge {
      display: inline-block;
      background: linear-gradient(135deg, #e5c158 0%, #b5891d 100%);
      color: #0d100f;
      padding: 3px 12px;
      border-radius: 50px;
      font-size: 0.75rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .director-name {
      font-size: 1.12rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }

    .director-role {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--gold-light);
      margin-top: 2px;
    }

    /* फोन र WhatsApp छेउछाउ बटनहरू */
    .quick-contact-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
